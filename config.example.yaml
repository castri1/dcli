# Deployment CLI Configuration
# Copy this file to ~/.deployment-cli/config.yaml and edit it with your settings.

environments:
  dev:
    profile: my-company-dev
    region: us-east-1
    pipelines:
      - name: my-app-dev
        description: "Main application - Dev"
        hooks:
          pre-deploy:
            - description: Run local checks
              command: npm test
          post-deploy:
            - description: Smoke test deployed app
              command: npm run smoke:test
      - name: my-api-dev
        description: "API service - Dev"

  qa:
    profile: my-company-qa
    region: us-east-1
    pipelines:
      - name: my-app-qa
        description: "Main application - QA"

  prod:
    profile: my-company-prod
    region: us-east-1
    pipelines:
      - name: my-app-prod
        description: "Main application - Production"

defaults:
  pollIntervalSeconds: 10
  notifications: true
